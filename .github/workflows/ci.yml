# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone sourDough sibling
        uses: actions/checkout@v4
        with:
          repository: ecoPrimals/sourDough
          path: ../sourDough
          token: ${{ secrets.SOURDOUGH_PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-features --all-targets

      - name: Test
        run: cargo test --all-features --workspace

      - name: Docs
        run: cargo doc --all-features --no-deps

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone sourDough sibling
        uses: actions/checkout@v4
        with:
          repository: ecoPrimals/sourDough
          path: ../sourDough
          token: ${{ secrets.SOURDOUGH_PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: >
          cargo llvm-cov --all-features --workspace
          --ignore-filename-regex 'tests/|examples/'
          --fail-under-lines 85
          --lcov --output-path lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  release:
    name: Release (musl-static)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, deny, coverage]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone sourDough sibling
        uses: actions/checkout@v4
        with:
          repository: ecoPrimals/sourDough
          path: ../sourDough
          token: ${{ secrets.SOURDOUGH_PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p skunk-bat-server

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/skunkbat skunkbat-${{ matrix.target }}
          strip skunkbat-${{ matrix.target }} 2>/dev/null || true

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: skunkbat-${{ matrix.target }}
