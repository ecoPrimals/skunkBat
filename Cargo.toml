[workspace]
resolver = "2"
members = [
    "crates/skunk-bat-core",
    "crates/skunk-bat-integrations",
    "crates/skunk-bat-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/skunkBat"
authors = ["ecoPrimals Project"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs", "process", "signal"] }

# Byte buffers
bytes = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Cryptography (BTSP Phase 3 — ChaCha20-Poly1305 encrypted framing)
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Virtual workspace integration tests
[package]
name = "skunk-bat-tests"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[test]]
name = "integration_e2e"
path = "tests/integration_e2e.rs"

[[test]]
name = "integration_beardog"
path = "tests/integration_beardog.rs"

[[test]]
name = "integration_songbird"
path = "tests/integration_songbird.rs"

[[test]]
name = "integration_toadstool"
path = "tests/integration_toadstool.rs"

[dependencies]
skunk-bat-core = { path = "crates/skunk-bat-core" }
skunk-bat-integrations = { path = "crates/skunk-bat-integrations" }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
