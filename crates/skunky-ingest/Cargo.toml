[package]
name = "skunky-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Log tailer that feeds live traffic observations into skunkBat's behavioral profiler"

[[bin]]
name = "skunky-ingest"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cellmembrane-types = { path = "../../../../gardens/cellMembrane/crates/cellmembrane-types" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
